name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rossbot-release
  cancel-in-progress: true

jobs:
  install-on-runner:
    name: Install on self-hosted Mac runner
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install and restart rossbot on runner
        run: ./scripts/install-macos-launchd.sh
